<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient: Deep Indigo to Vibrant Violet -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Emerald Sparkle Gradient (Symbolizing wealth & growth) -->
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Drop shadow for depth -->
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#0F172A" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Modern Rounded Squircle Frame -->
  <rect width="64" height="64" rx="18" fill="url(#bgGrad)" />
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="17.25" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Geometric Modern 'M' (Stylized as Ascending Financial Pillars & Mortgage Peak) -->
  <path
    d="M 14 47 V 21 C 14 19.34 15.34 18 17 18 C 18.25 18 19.38 18.78 19.82 19.95 L 32 44.5 L 44.18 19.95 C 44.62 18.78 45.75 18 47 18 C 48.66 18 50 19.34 50 21 V 47"
    stroke="#FFFFFF"
    stroke-width="6.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#iconShadow)"
  />

  <!-- Subtle Growth Accent: Rising Trend Bar Inside Central V -->
  <path
    d="M 32 42 V 31"
    stroke="#34D399"
    stroke-width="4.5"
    stroke-linecap="round"
  />

  <!-- High-Tech Glow Dot: Wealth & AI Peak Indicator -->
  <circle cx="50" cy="14" r="5" fill="url(#sparkleGrad)" />
  <circle cx="50" cy="14" r="2.2" fill="#FFFFFF" />
</svg>
